name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build every package as artifacts without publishing (to test packaging).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm run check
      - name: Build packages
        run: npm run build && npx electron-builder --linux AppImage deb pacman --publish never
      - name: Smoke the packaged app
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a ./release/linux-unpacked/study-buddy --smoke
      - name: Pack the unpacked app for the Flatpak build
        run: tar -czf release/linux-unpacked.tar.gz -C release linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
      - uses: actions/upload-artifact@v4
        with:
          name: linux-unpacked
          path: release/linux-unpacked.tar.gz

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-unpacked
          path: release
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: study-buddy.flatpak
          manifest-path: flatpak/io.github.mykolavaskevych.StudyBuddy.yml
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npm run build && npx electron-builder --win nsis --publish never
      - name: Smoke the packaged app
        run: '& "release/win-unpacked/study-buddy.exe" --smoke; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "Study Buddy $GITHUB_REF_NAME" \
            dist/linux/* dist/windows/* $(find dist -name '*.flatpak')
